apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: kiali
spec:
  istio_namespace: istio-system
  auth:
    strategy: anonymous
  deployment:
    accessible_namespaces:
    - bookinfo
    - istio-system
    view_only_mode: false
  external_services:
    prometheus:
      url: http://prometheus.istio-system.svc.cluster.local:9090
    tracing:
      enabled: true
      in_cluster_url: http://tracing.jaeger:80/jaeger
      url: http://localhost:16686/jaeger
