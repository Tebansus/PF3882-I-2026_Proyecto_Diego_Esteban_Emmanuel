apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: load-generator
        image: bookinfo-loadgen:latest # built from Dockerfile.loadgen and loaded into kind by run-all.sh
        imagePullPolicy: IfNotPresent
        args:
          - "--url"
          - "http://productpage:9080/productpage"
          - "--threads"
          - "4"
          - "--delay-min"
          - "0.1"
          - "--delay-max"
          - "0.5"
          - "--header-rate"
          - "0.2"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
